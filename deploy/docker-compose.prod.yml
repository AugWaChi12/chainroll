name: chainroll

services:
  db:
    image: postgres:17-alpine
    container_name: chainroll-db
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      POSTGRES_USER: chainroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: chainroll
    volumes:
      - chainroll_pgdata:/var/lib/postgresql/data
      - ../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chainroll -d chainroll']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CHAIN: ${NEXT_PUBLIC_CHAIN:-testnet}
        NEXT_PUBLIC_CHAINROLL_ADDRESS: ${NEXT_PUBLIC_CHAINROLL_ADDRESS:-}
        NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID:-}
        NEXT_PUBLIC_BITKUB_CLIENT_ID: ${NEXT_PUBLIC_BITKUB_CLIENT_ID:-}
        NEXT_PUBLIC_BITKUB_SDK_ID: ${NEXT_PUBLIC_BITKUB_SDK_ID:-}
    container_name: chainroll-web
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://chainroll:${POSTGRES_PASSWORD}@db:5432/chainroll
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in .env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-chainroll-public}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-chainroll-private}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NEXT_PUBLIC_CHAIN: ${NEXT_PUBLIC_CHAIN:-testnet}
      NEXT_PUBLIC_CHAINROLL_ADDRESS: ${NEXT_PUBLIC_CHAINROLL_ADDRESS:-}
      NEXT_PUBLIC_WC_PROJECT_ID: ${NEXT_PUBLIC_WC_PROJECT_ID:-}
      NEXT_PUBLIC_BITKUB_CLIENT_ID: ${NEXT_PUBLIC_BITKUB_CLIENT_ID:-}
      NEXT_PUBLIC_BITKUB_SDK_ID: ${NEXT_PUBLIC_BITKUB_SDK_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: chainroll-caddy
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN:-chainroll.nan-tai.com}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  chainroll_pgdata:
  caddy_data:
  caddy_config:
