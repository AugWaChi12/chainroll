services:
  db:
    image: postgres:17-alpine
    container_name: chainroll-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:5435:5432'
    environment:
      POSTGRES_USER: chainroll
      POSTGRES_PASSWORD: chainroll
      POSTGRES_DB: chainroll
    volumes:
      - chainroll_pgdata:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chainroll -d chainroll']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  chainroll_pgdata:
